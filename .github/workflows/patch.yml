name: patch-ipa
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag containing Roblox.ipa'
        required: true
        default: 'v1'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: list assets on release (debug)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.tag.outputs.value }}" \
            --repo "${{ github.repository }}" \
            --json tagName,assets \
            --jq '{tag: .tagName, assets: [.assets[].name]}'

      - name: download IPA from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ steps.tag.outputs.value }}" \
            --repo "${{ github.repository }}" \
            --pattern '*.ipa' \
            --dir .
          ls -la *.ipa

      - name: patch
        run: |
          IPA=$(ls *.ipa | head -1)
          echo "patching: $IPA"
          python3 patcher/patch_ipa.py "$IPA" Roblox-patched.ipa
          ls -la Roblox-patched.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Roblox-patched
          path: Roblox-patched.ipa
          retention-days: 30
