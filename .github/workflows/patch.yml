name: patch-ipa
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1)'
        required: true
        default: 'v1'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: show release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.tag.outputs.value }}" \
            --repo "${{ github.repository }}" \
            --json tagName,isDraft,assets > /tmp/r.json
          echo "### Release Assets" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/r.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/r.json

      - name: download IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          if gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*.ipa' --dir . 2>/dev/null; then
            echo "matched *.ipa"
          elif gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*.IPA' --dir . 2>/dev/null; then
            echo "matched *.IPA"
          else
            echo "ERROR: no .ipa asset on release '$TAG' — check Job Summary above"
            exit 1
          fi
          ls -lah

      - name: patch
        run: |
          IPA_FILE=$(find . -maxdepth 1 -type f \( -name '*.ipa' -o -name '*.IPA' \) | head -1)
          [ -z "$IPA_FILE" ] && { echo "no IPA file after download"; exit 1; }
          python3 patcher/patch_ipa.py "$IPA_FILE" Roblox-patched.ipa
          ls -lah Roblox-patched.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Roblox-patched
          path: Roblox-patched.ipa
          retention-days: 30
