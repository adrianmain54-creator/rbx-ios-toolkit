name: patch-ipa
on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: download IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This automatically finds the latest release tag, whether it's V1, v1, or v2
          TAG=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName --jq '.[0].tagName')
          echo "Found latest release tag: $TAG"
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*.ipa' --dir .
          ls -lah

      - name: patch
        run: |
          IPA_FILE=$(find . -maxdepth 1 -type f \( -name '*.ipa' -o -name '*.IPA' \) | head -1)
          python3 patcher/patch_ipa.py "$IPA_FILE" Roblox-patched.ipa
          ls -lah Roblox-patched.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Roblox-patched
          path: Roblox-patched.ipa
