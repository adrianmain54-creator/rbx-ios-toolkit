name: patch-ipa
on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  patch:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: download IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName --jq '.[0].tagName')
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*.ipa' --dir .

      - name: compile framework
        run: |
          mkdir -p dylib/RBXSwapKit.framework
          xcrun -sdk iphoneos clang -arch arm64 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -miphoneos-version-min=15.0 -dynamiclib -O2 -fobjc-arc \
            -framework UIKit -framework PhotosUI -framework Foundation \
            -install_name @executable_path/Frameworks/RBXSwapKit.framework/RBXSwapKit \
            dylib/rbxswap.c dylib/picker.m \
            -o dylib/RBXSwapKit.framework/RBXSwapKit

      - name: patch IPA
        run: |
          IPA_FILE=$(find . -maxdepth 1 -type f -name '*.ipa' | head -1)
          python3 patcher/patch_ipa.py "$IPA_FILE" Roblox-patched.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Roblox-patched
          path: Roblox-patched.ipa
