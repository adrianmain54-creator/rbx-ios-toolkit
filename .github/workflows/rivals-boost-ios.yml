name: Rivals Boost iOS Build

on:
  push:
    branches: [rivals-boost-ipad]
    paths:
      - "ios/RivalsBoost/**"
      - ".github/workflows/rivals-boost-ios.yml"
  pull_request:
    paths:
      - "ios/RivalsBoost/**"
      - ".github/workflows/rivals-boost-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios/RivalsBoost
        run: xcodegen generate
      - name: Build for iPad simulator
        working-directory: ios/RivalsBoost
        run: xcodebuild -project RivalsBoost.xcodeproj -scheme RivalsBoost -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
